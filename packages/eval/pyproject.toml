[project]
name = "homer-eval"
version = "0.1.0"
description = "Gmail, Calendar and People simulator: the fixture for every Google test and eval."
requires-python = ">=3.12,<3.13"
dependencies = [
    "homer-core",
    "homer-net",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "typer>=0.15",
    "pydantic-ai-slim[openai]>=2.67.0",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.scripts]
homer-sim = "homer_sim.cli:app"
homer-eval = "homer_eval.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["homer_sim", "homer_eval"]
