[project]
name = "achilles-core"
version = "0.1.0"
description = "Achilles backend: API, agent, scheduler and approvals."
requires-python = ">=3.12,<3.13"
dependencies = [
    "achilles-net",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "typer>=0.15",
    "structlog>=24.4",
    "pydantic-ai-slim[mcp,openai]>=1.0",
    "sqlmodel>=0.0.22",
    "alembic>=1.14",
    "itsdangerous>=2.2",
    "psutil>=6.0",
]

[project.scripts]
achilles = "achilles_core.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["achilles_core"]

[dependency-groups]
dev = [
    "pytest-playwright>=0.6",
]
