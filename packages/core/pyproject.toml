[project]
name = "achilles-core"
version = "0.1.0"
description = "Achilles backend: API, agent, scheduler and approvals."
requires-python = ">=3.12,<3.13"
dependencies = [
    "achilles-net",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "typer>=0.15",
    "structlog>=24.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["achilles_core"]
