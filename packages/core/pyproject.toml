[project]
name = "homer-core"
version = "0.1.3"
description = "Homer backend: API, agent, scheduler and approvals."
requires-python = ">=3.12,<3.13"
dependencies = [
    "homer-net",
    "fastapi>=0.163.2",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "typer>=0.15",
    "structlog>=24.4",
    "pydantic-ai-slim[mcp,openai]>=1.0",
    "sqlmodel>=0.0.22",
    "alembic>=1.14",
    "apscheduler>=3.10,<4",
    "itsdangerous>=2.2",
    "psutil>=6.0",
    "nh3>=0.3.7",
]

[project.scripts]
homer = "homer_core.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
artifacts = ["homer_core/models/manifest.json"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = ["homer_core"]

[dependency-groups]
dev = [
    "fastmcp>=4.1",
    "pytest-playwright>=0.6",
    "homer-eval",
    "homer-mcp-google",
    "homer-mcp-search",
    "homer-mcp-system",
]
