[project]
name = "homer-net"
version = "0.1.0"
description = "The one allowlisted HTTP client every Homer package uses for outbound calls."
requires-python = ">=3.12,<3.13"
dependencies = ["httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["homer_net"]
