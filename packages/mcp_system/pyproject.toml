[project]
name = "homer-mcp-system"
version = "0.1.3"
description = "Homer MCP server for the current time and natural-language dates."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastmcp>=4.2.1,<5",
    "dateparser>=1.2",
]

[project.scripts]
homer-mcp-system = "homer_mcp_system.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["homer_mcp_system"]
