[project]
name = "achilles-mcp-system"
version = "0.1.0"
description = "Achilles MCP server for the current time and natural-language dates."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastmcp>=4.0,<5",
    "dateparser>=1.2",
]

[project.scripts]
achilles-mcp-system = "achilles_mcp_system.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["achilles_mcp_system"]
