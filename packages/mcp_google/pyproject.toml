[project]
name = "achilles-mcp-google"
version = "0.1.0"
description = "MCP server exposing mail, calendar and contacts tools over Google's REST APIs."
requires-python = ">=3.12,<3.13"
dependencies = [
    "achilles-net",
    "fastmcp>=4,<5",
    "google-auth-oauthlib>=1.2",
]

[project.scripts]
achilles-mcp-google = "achilles_mcp_google.server:main"
achilles-mcp-google-setup = "achilles_mcp_google.auth:setup"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["achilles_mcp_google"]

[dependency-groups]
dev = ["achilles-eval"]
