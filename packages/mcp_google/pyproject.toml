[project]
name = "homer-mcp-google"
version = "0.1.3"
description = "MCP server exposing mail, calendar and contacts tools over Google's REST APIs."
requires-python = ">=3.12,<3.13"
dependencies = [
    "homer-net",
    "fastmcp>=4,<5",
    "google-auth-oauthlib>=1.2",
]

[project.scripts]
homer-mcp-google = "homer_mcp_google.server:main"
homer-mcp-google-setup = "homer_mcp_google.auth:setup"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["homer_mcp_google"]

[dependency-groups]
dev = ["homer-eval"]
