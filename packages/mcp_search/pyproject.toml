[project]
name = "homer-mcp-search"
version = "0.1.2"
description = "Homer MCP server for web search and page fetching."
requires-python = ">=3.12,<3.13"
dependencies = [
    "homer-net",
    "fastmcp>=4.0,<5",
    "trafilatura>=2.0",
]

[project.scripts]
homer-mcp-search = "homer_mcp_search.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["homer_mcp_search"]
