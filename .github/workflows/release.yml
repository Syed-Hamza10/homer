name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: dashboard/pnpm-lock.yaml
      - run: uv sync --all-packages
      - run: uv run pytest -m "not e2e"
      - run: cd dashboard && pnpm install --frozen-lockfile && pnpm build
      - name: Check tag matches the package version
        run: |
          uv run python - <<'PY'
          import homer_core, os
          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          assert homer_core.__version__ == tag, (homer_core.__version__, tag)
          PY
      - run: uv build --all-packages --out-dir dist
      - run: rm -f dist/homer_eval-*.whl dist/*.tar.gz
      - name: Verify the wheel contains the dashboard and manifest
        run: |
          uv run python - <<'PY'
          import glob, zipfile
          wheel = glob.glob("dist/homer_core-*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          assert "homer_core/static/index.html" in names
          assert "homer_core/models/manifest.json" in names
          print("wheel verified")
          PY
      - name: Export the locked dependency set and checksums
        run: |
          uv export --all-packages --no-dev --no-emit-workspace --no-hashes \
            --format requirements-txt -o dist/requirements.lock
          cd dist && sha256sum ./*.whl requirements.lock > SHA256SUMS && cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          if-no-files-found: error

  smoke:
    needs: build
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      HOMER_HOME: ${{ github.workspace }}/homer-home
      HOMER_PASSPHRASE: smoke-test
    steps:
      - uses: astral-sh/setup-uv@v5
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Verify the checksums
        run: cd dist && (sha256sum -c SHA256SUMS || shasum -a 256 -c SHA256SUMS)
      - name: Install the wheels into a clean venv
        run: |
          uv venv --python 3.12 venv
          uv pip install --python venv/bin/python -c dist/requirements.lock dist/*.whl
      - name: Run the installed CLI
        run: |
          venv/bin/homer db upgrade
          venv/bin/homer doctor --quick
          venv/bin/homer privacy > /dev/null

  publish:
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            dist/*.whl dist/SHA256SUMS dist/requirements.lock \
            scripts/install.sh CLIENT_ONBOARDING.md PRIVACY.md
