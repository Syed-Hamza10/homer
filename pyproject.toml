[project]
name = "homer"
version = "0.1.0"
description = "Local-first AI assistant for email, calendar and search, running on the client's machine through Ollama."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "hatchling>=1.25",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.8",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
homer-net = { workspace = true }
homer-core = { workspace = true }
homer-eval = { workspace = true }
homer-mcp-google = { workspace = true }
homer-mcp-search = { workspace = true }
homer-mcp-system = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"httpx".msg = "Use homer_net."
"requests".msg = "Use homer_net."
"aiohttp".msg = "Use homer_net."
"urllib.request".msg = "Use homer_net."

[tool.ruff.lint.per-file-ignores]
"packages/net/**" = ["TID251"]
"packages/*/tests/**" = ["TID251"]

[tool.pytest.ini_options]
testpaths = ["packages"]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["e2e: real server, real SQLite, real Ollama model and a real browser"]
filterwarnings = [
    "ignore:.*httpx.AsyncClient.*:pydantic_ai._warnings.PydanticAIDeprecationWarning",
]

[tool.ruff.lint.isort]
known-first-party = [
    "homer_net",
    "homer_core",
    "homer_eval",
    "homer_sim",
    "homer_mcp_google",
    "homer_mcp_search",
    "homer_mcp_system",
]
